[env:esp32doit-devkit-v1]
platform = espressif32@6.4.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; YE LINE MAGIC KAREGI: Ye linker ko bypass function allow karne ke liye force karti hai
build_flags = -Wl,--allow-multiple-definition

; RF24 Library automatically download karega
lib_deps = 
    nrf24/RF24@^1.4.9