[env:esp32doit-devkit-v1]
platform = espressif32@6.4.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; THIS LINE DOES THE MAGIC: It forces the linker to allow the bypass function
build_flags = -Wl,--allow-multiple-definition

; This will automatically download the RF24 library
lib_deps = 
    nrf24/RF24@^1.4.9
